[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot"
version = "0.1.0"
description = "A local interactive coding agent CLI prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "prompt-toolkit>=3.0",
  "pydantic>=2.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.scripts]
codepilot = "codepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
